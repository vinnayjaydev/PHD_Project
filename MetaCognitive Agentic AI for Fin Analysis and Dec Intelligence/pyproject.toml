[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "metacog-finance"
version = "1.0.0"
description = "A Meta-Cognitive Agentic Framework for Adaptive Financial Analytics and Decision Intelligence Using Retrieval-Augmented LLMs"
authors = [{ name = "AI Research & Quantitative Intelligence Lab" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "requests>=2.28.0",
    "rich>=13.0.0",
    "gradio>=4.0.0",
    "pytest>=7.0.0",
]

[project.scripts]
metacog-fin = "metacog_finance.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
